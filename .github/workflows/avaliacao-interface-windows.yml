name: Estudo técnico de interface Windows
on:
  push:
    branches: ['reforma/estudo-interface']
    paths:
      - 'prototipos/reforma/avaliacao/**'
      - '.github/workflows/avaliacao-interface-windows.yml'
permissions:
  contents: read
jobs:
  estudo:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Instalar somente requisitos do ensaio
        run: python -m pip install -r prototipos/reforma/avaliacao/requirements.txt
      - name: Preparar diretório isolado de resultados
        shell: pwsh
        run: New-Item -ItemType Directory -Force resultados-tecnicos
      - name: Medir cenários equivalentes em Windows
        run: python prototipos/reforma/avaliacao/executar_comparacao.py --uia --saida resultados-tecnicos/COMPARACAO_WINDOWS.json
      - name: Gerar e executar os dois pacotes de estudo
        run: python prototipos/reforma/avaliacao/empacotar_ensaio.py --saida resultados-tecnicos/pacotes
      - name: Guardar relatórios de estudo e erros em uma frente própria
        if: always()
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_BASE: ${{ github.sha }}
        run: |
          $relatorio = "prototipos/reforma/avaliacao/resultados/windows-$env:RUN_ID"
          New-Item -ItemType Directory -Force $relatorio
          if (Test-Path resultados-tecnicos/COMPARACAO_WINDOWS.json) { Copy-Item resultados-tecnicos/COMPARACAO_WINDOWS.json $relatorio }
          if (Test-Path resultados-tecnicos/pacotes/EMPACOTAMENTO.json) { Copy-Item resultados-tecnicos/pacotes/EMPACOTAMENTO.json $relatorio }
          Get-ChildItem resultados-tecnicos -Recurse -File -Filter '*.log' | Copy-Item -Destination $relatorio
          @{ commit_base=$env:COMMIT_BASE; execucao=$env:RUN_ID; observacao='Ensaio isolado. Sem release, migração, PWA ou dados reais.' } | ConvertTo-Json | Set-Content "$relatorio/ORIGEM.json" -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $relatorio
          git commit -m "Registra estudo Windows $env:RUN_ID"
          git push origin "HEAD:refs/heads/reforma/resultados-windows-$env:RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relatorios-estudo-interface-Windows
          path: |
            resultados-tecnicos/**/*.json
            resultados-tecnicos/**/*.log
          if-no-files-found: ignore
          retention-days: 14
