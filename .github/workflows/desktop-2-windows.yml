name: Desktop 2 - Pacote e transicao Windows
on:
  workflow_dispatch:
  push:
    branches: ['reforma/estudo-interface']
    tags: ['v2.*']
    paths:
      - 'reforma_desktop/**'
      - 'ProgramFeira/atualizador.py'
      - 'executar_desktop.py'
      - 'GestaoDaFeiraQt.spec'
      - 'tools/gerar_desktop_qt.py'
      - 'tools/testar_transicao_qt_windows.py'
      - 'tools/versao_desktop_windows.txt'
      - '.github/workflows/desktop-2-windows.yml'
permissions:
  contents: read
jobs:
  candidata:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Instalar dependencias fixadas
        run: python -m pip install -r requirements-desktop-build.txt
      - name: Preparar resolucao da VM de teste
        run: python prototipos/reforma/avaliacao/tela_windows.py --saida evidencias-qt/TELA_WINDOWS.json
      - name: Reutilizar suites nativas aprovadas somente com fontes identicas
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, sqlite3, subprocess
          from pathlib import Path
          evidencia = '1f765dc2ac6aca14ea1701edff8f68501698e77e'
          base = 'a1c20583b6bce8299d1126a49bb81826cf0036d1'
          fontes = ['ProgramFeira', 'reforma_desktop/*.py', 'prototipos/reforma', '*.spec',
                    'requirements*.txt', 'executar*.py', 'tests', 'tools',
                    ':(exclude)tools/testar_transicao_qt_windows.py']
          reutilizar = False
          try:
              subprocess.run(['git','fetch','--no-tags','origin',evidencia], check=True)
              iguais = subprocess.run(['git','diff','--quiet',base,'HEAD','--',*fontes]).returncode == 0
              pasta = 'reforma_desktop/resultados/pacote-windows-41054098828/'
              origem = json.loads(subprocess.check_output(['git','show',evidencia+':'+pasta+'ORIGEM.json']))
              assert origem['commit'] == base
              if iguais:
                  resultados = {}
                  for nome in ('reforma_desktop-tests','tests'):
                      r = json.loads(subprocess.check_output(['git','show',evidencia+':'+pasta+nome+'.json']))
                      assert r['sucesso'] and r['executados'] > 0 and r['aprovados'] == r['executados']
                      assert r['suite'] == ('reforma_desktop/tests' if nome == 'reforma_desktop-tests' else 'tests')
                      assert r['python'] == platform.python_version() and r['sqlite'] == sqlite3.sqlite_version
                      assert r['plataforma'].startswith('Windows') and not r['falhas'] and not r['erros'] and not r['ignorados']
                      r['reutilizado_de'] = dict(execucao=41054098828, commit=base, evidencia=evidencia,
                          fontes_identicas_a=os.environ['GITHUB_SHA'])
                      resultados[nome] = r
                  for nome, r in resultados.items():
                      Path('evidencias-qt',nome+'.json').write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
                  reutilizar = True
          except (AssertionError, OSError, ValueError, KeyError, subprocess.CalledProcessError):
              print('Evidencia indisponivel: executar todas as suites.')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('FEIRA_REUTILIZAR_SUITES='+('1' if reutilizar else '0')+'\n')
          print('Reutilizacao validada:',reutilizar)
          PY
      - name: Testar Qt, versao estavel e prototipos
        shell: pwsh
        run: |
          $suites = @('reforma_desktop/tests','tests','prototipos/reforma')
          if ($env:FEIRA_REUTILIZAR_SUITES -eq '1') { $suites = @('prototipos/reforma') }
          foreach ($suite in $suites) {
            $nome = $suite.Replace('/','-')
            python reforma_desktop/validar.py --suite $suite --saida "evidencias-qt/$nome.json"
            if ($LASTEXITCODE -ne 0) { throw "Falha na suite $suite" }
          }
          python reforma_desktop/avaliacao/revisar_etapa4.py --saida evidencias-qt/REVISAO.json --exigir-conformidade
          if ($LASTEXITCODE -ne 0) { throw 'Revisao reprovada' }
      - name: Compilar e testar candidata Qt
        run: python tools/gerar_desktop_qt.py
      - uses: actions/checkout@v4
        with:
          ref: v1.7.1
          path: baseline-171
      - name: Compilar e testar a referencia 1.7.1 sem modifica-la
        run: python baseline-171/tools/gerar_executavel.py
      - name: Trocar 1.7.1 por Qt e recuperar apos falha de abertura
        run: >-
          python tools/testar_transicao_qt_windows.py
          --pacote-171 baseline-171/dist/GestaoDaFeira-Windows-x64.zip
          --pacote-qt dist-qt/GestaoDaFeira-Windows-x64.zip
          --saida dist-qt/VALIDACAO_ATUALIZADOR.json
      - name: Disponibilizar candidata e evidencias aprovadas
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-2-Windows-candidata
          path: |
            dist-qt/GestaoDaFeira-Windows-x64.zip
            dist-qt/SHA256.txt
            dist-qt/VALIDACAO_WINDOWS.json
            dist-qt/VALIDACAO_ATUALIZADOR.json
            evidencias-qt/*.json
          if-no-files-found: error
      - name: Publicar atualizacao estavel somente por tag 2.x aprovada
        if: startsWith(github.ref, 'refs/tags/v2.')
        env:
          GH_TOKEN: ${{ github.token }}
          FEIRA_TAG: ${{ github.ref_name }}
          FEIRA_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          python -c "import os; from reforma_desktop.versao import VERSAO; assert os.environ['FEIRA_TAG'] == 'v'+VERSAO"
          if ($LASTEXITCODE -ne 0) { throw 'Tag e versao do pacote divergem' }
          python tools/publicar_desktop_qt.py --pasta dist-qt --evidencias evidencias-qt --commit $env:FEIRA_SHA --publicar
          if ($LASTEXITCODE -ne 0) { throw 'Publicacao nao concluida' }
      - name: Guardar evidencias em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-2-diagnostico
          path: |
            dist-qt/*.json
            evidencias-qt/*.json
            build-qt/GestaoDaFeiraQt/warn-*.txt
          if-no-files-found: ignore
      - name: Restaurar resolucao da VM
        if: always()
        shell: pwsh
        run: |
          if (Test-Path evidencias-qt/TELA_WINDOWS.json) { python prototipos/reforma/avaliacao/tela_windows.py --saida evidencias-qt/TELA_WINDOWS.json --restaurar }
      - name: Registrar resultado em branch separada de evidencias
        if: always()
        shell: pwsh
        env:
          FEIRA_RUN: ${{ github.run_id }}
          FEIRA_COMMIT: ${{ github.sha }}
          FEIRA_STATUS: ${{ job.status }}
        run: |
          $destino = "reforma_desktop/resultados/pacote-windows-$env:FEIRA_RUN"
          New-Item -ItemType Directory -Force $destino
          if (Test-Path evidencias-qt) { Get-ChildItem evidencias-qt -Filter '*.json' | Copy-Item -Destination $destino }
          if (Test-Path dist-qt) { Get-ChildItem dist-qt -Filter '*.json' | Copy-Item -Destination $destino }
          @{commit=$env:FEIRA_COMMIT; execucao=$env:FEIRA_RUN; resultado=$env:FEIRA_STATUS} | ConvertTo-Json | Set-Content "$destino/ORIGEM.json" -Encoding utf8
          git switch -c "evidencias/desktop-2-$env:FEIRA_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel criar a branch de evidencias' }
          git add $destino
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Registrar validacao Windows desktop 2 ($env:FEIRA_RUN)"
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel registrar evidencias' }
          git push origin "HEAD:refs/heads/evidencias/desktop-2-$env:FEIRA_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel enviar evidencias' }
