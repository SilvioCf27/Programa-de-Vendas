name: Diagnostico do executavel

on:
  workflow_dispatch:
    inputs:
      versao:
        description: Tag da versao a conferir
        required: true
        default: v1.4.0
  workflow_run:
    workflows: ['Executavel Windows']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico-executavel.yml']

permissions:
  contents: write
  actions: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Registrar estado e falhas da compilacao
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ inputs.versao || '' }}
          COMMIT_CONFERIR: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from ProgramFeira.versao import VERSAO
          versao = os.environ['VERSAO'] or 'v' + VERSAO
          referencia = os.environ['VERSAO'] or os.environ['COMMIT_CONFERIR']
          sha = subprocess.check_output(['git', 'rev-parse', referencia + '^{commit}'], text=True).strip()
          dados = subprocess.check_output(['gh', 'run', 'list', '--workflow', 'executavel-windows.yml', '--commit', sha, '--limit', '10', '--json', 'databaseId,status,conclusion,url,headBranch'], text=True)
          runs = json.loads(dados)
          for run in runs:
              if run['conclusion'] == 'failure':
                  logs = subprocess.run(['gh', 'run', 'view', str(run['databaseId']), '--log-failed'], capture_output=True, text=True)
                  run['falhas'] = logs.stdout[-14000:]
          Path('diagnostico.json').write_text(json.dumps(dict(versao=versao, commit=sha, execucoes=runs), ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          VERSAO=$(python -c "import json; print(json.load(open('diagnostico.json'))['versao'])")
          TAG="diagnostico/executavel-$VERSAO-${{ github.run_id }}"
          git tag -a "$TAG" -F diagnostico.json
          git push origin "refs/tags/$TAG"
