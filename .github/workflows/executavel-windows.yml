name: Executavel Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ProgramFeira/**'
      - 'tests/**'
      - 'tools/gerar_executavel.py'
      - 'tools/versao_windows.txt'
      - 'tools/testar_windows.py'
      - 'executar.py'
      - 'GestaoDaFeira.spec'
      - 'requirements*.txt'
      - 'docs/EXECUTAVEL.md'
      - '.github/workflows/executavel-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-build.txt
      - name: Testar o programa no Windows
        run: python tools/testar_windows.py
      - name: Gerar e verificar o executavel
        run: python tools/gerar_executavel.py
      - name: Disponibilizar pacote aprovado
        uses: actions/upload-artifact@v4
        with:
          name: GestaoDaFeira-Windows-x64
          path: |
            dist/GestaoDaFeira-Windows-x64.zip
            dist/SHA256.txt
            dist/VALIDACAO_WINDOWS.json
          if-no-files-found: error
          retention-days: 30
      - name: Guardar diagnostico da compilacao
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Windows
          path: |
            build/GestaoDaFeira/warn-GestaoDaFeira.txt
            dist/VALIDACAO_WINDOWS.json
            dist/TESTES_WINDOWS.json
          if-no-files-found: ignore

  publicar:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GestaoDaFeira-Windows-x64
          path: pacote
      - name: Publicar versao aprovada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ github.ref_name }}
        run: >-
          gh release view "$VERSAO" >/dev/null 2>&1 || gh release create "$VERSAO"
          pacote/GestaoDaFeira-Windows-x64.zip
          pacote/SHA256.txt
          pacote/VALIDACAO_WINDOWS.json
          --verify-tag
          --title "Gestão da Feira $VERSAO — Windows"
          --notes-file .github/notas-executavel.md

      - name: Conferir o download e registrar a verificacao
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ github.ref_name }}
        run: |
          gh release download "$VERSAO" --dir conferencia --pattern 'GestaoDaFeira-Windows-x64.zip' --pattern 'SHA256.txt' --pattern 'VALIDACAO_WINDOWS.json'
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          pasta = Path('conferencia')
          pacote = pasta / 'GestaoDaFeira-Windows-x64.zip'
          sha = hashlib.sha256(pacote.read_bytes()).hexdigest()
          assert sha == (pasta / 'SHA256.txt').read_text().split()[0]
          assert sha == Path('pacote/SHA256.txt').read_text().split()[0]
          validacao = json.loads((pasta / 'VALIDACAO_WINDOWS.json').read_text(encoding='utf-8'))
          assert validacao['sucesso'] and validacao['empacotado']
          assert validacao['plataforma'] == 'win32' and validacao['temas']
          assert validacao['taxas_semanais'] and validacao['fechamento_configuravel']
          assert validacao['compra_total'] and validacao['edicao_compra']
          assert 'v' + validacao['versao'] == os.environ['VERSAO']
          recibo = dict(tag=os.environ['VERSAO'], commit=os.environ['GITHUB_SHA'],
                        sha256=sha, bytes=pacote.stat().st_size, validacao=validacao)
          Path('conferencia.json').write_text(json.dumps(recibo, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git ls-remote --exit-code --tags origin "refs/tags/validacao/$VERSAO" >/dev/null; then
            git tag -a "validacao/$VERSAO" -F conferencia.json "$GITHUB_SHA"
            git push origin "refs/tags/validacao/$VERSAO"
          fi
