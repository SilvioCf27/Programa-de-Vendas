name: Reforma Qt - Contraprova de abertura
on:
  push:
    branches: ['reforma/estudo-interface']
    paths:
      - 'reforma_desktop/avaliacao/medir_abertura.py'
      - '.github/workflows/reforma-abertura-windows.yml'
permissions:
  contents: read
jobs:
  medir:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências isoladas
        run: python -m pip install -r prototipos/reforma/requirements.txt openpyxl==3.1.5
      - name: Preparar resolução da VM
        run: python prototipos/reforma/avaliacao/tela_windows.py --saida resultados-abertura/TELA_WINDOWS.json
      - name: Comparar abertura com revisões alternadas
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'feira-abertura-antes'
          git worktree add --detach $base 18592c2d1a13108a08b7d46486497aa5d387ed11
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível preparar a referência.' }
          New-Item -ItemType Directory -Force "$base/reforma_desktop/desempenho"
          Copy-Item reforma_desktop/desempenho/medir.py "$base/reforma_desktop/desempenho/"
          Copy-Item reforma_desktop/avaliacao/medir_abertura.py "$base/reforma_desktop/avaliacao/"
          python reforma_desktop/avaliacao/medir_abertura.py --base $base --saida resultados-abertura/ABERTURA.json
          if ($LASTEXITCODE -ne 0) { throw 'Contraprova de abertura falhou.' }
          git worktree remove --force $base
      - name: Restaurar resolução da VM
        if: always()
        shell: pwsh
        run: |
          if (Test-Path resultados-abertura/TELA_WINDOWS.json) { python prototipos/reforma/avaliacao/tela_windows.py --saida resultados-abertura/TELA_WINDOWS.json --restaurar }
      - name: Registrar evidências
        if: always()
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_BASE: ${{ github.sha }}
        run: |
          $destino = "reforma_desktop/resultados/abertura-windows-$env:RUN_ID"
          New-Item -ItemType Directory -Force $destino
          Get-ChildItem resultados-abertura -File -Filter '*.json' | Copy-Item -Destination $destino
          @{commit_base=$env:COMMIT_BASE; execucao=$env:RUN_ID; observacao='Contraprova isolada de abertura; sem alteração funcional.'} | ConvertTo-Json | Set-Content "$destino/ORIGEM.json" -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $destino
          git commit -m "Registra abertura Windows $env:RUN_ID"
          git push origin "HEAD:refs/heads/reforma/abertura-windows-$env:RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Contraprova-Abertura-Desktop-Windows
          path: resultados-abertura/*.json
          retention-days: 14
