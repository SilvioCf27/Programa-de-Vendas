name: Reforma Qt - Vendas, Análises e Finanças
on:
  push:
    branches: ['reforma/estudo-interface']
    paths:
      - 'reforma_desktop/**'
      - 'executar_reforma.py'
      - '.github/workflows/reforma-vendas-windows.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências isoladas
        run: python -m pip install -r prototipos/reforma/requirements.txt openpyxl==3.1.5
      - name: Preparar resolução da VM de teste
        run: python prototipos/reforma/avaliacao/tela_windows.py --saida resultados-qt/TELA_WINDOWS.json
      - name: Verificar as três áreas integradas
        run: python reforma_desktop/validar.py --saida resultados-qt/INTEGRACAO_QT.json
      - name: Conferir regressão da versão estável
        if: always()
        run: python reforma_desktop/validar.py --suite tests --saida resultados-qt/PRODUCAO.json
      - name: Conferir protótipos visuais preservados
        if: always()
        run: python reforma_desktop/validar.py --suite prototipos/reforma --saida resultados-qt/PROTOTIPOS.json
      - name: Restaurar resolução da VM
        if: always()
        shell: pwsh
        run: |
          if (Test-Path resultados-qt/TELA_WINDOWS.json) { python prototipos/reforma/avaliacao/tela_windows.py --saida resultados-qt/TELA_WINDOWS.json --restaurar }
      - name: Registrar evidências na frente de estudo
        if: always()
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_BASE: ${{ github.sha }}
        run: |
          $destino = "reforma_desktop/resultados/windows-$env:RUN_ID"
          New-Item -ItemType Directory -Force $destino
          Get-ChildItem resultados-qt -File -Filter '*.json' | Copy-Item -Destination $destino
          @{commit_base=$env:COMMIT_BASE; execucao=$env:RUN_ID; observacao='Etapa 4: somente dados fictícios; sem release ou alteração da entrada estável.'} | ConvertTo-Json | Set-Content "$destino/ORIGEM.json" -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $destino
          git commit -m "Registra validação Windows da integração Qt $env:RUN_ID"
          git push origin "HEAD:refs/heads/reforma/validacao-vendas-$env:RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Validacao-Desktop-Qt-Windows
          path: resultados-qt/*.json
          retention-days: 14
